name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    name: Vectors match the schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@423e53c060d3baad2ff6b1e1673e1b1b8a0e84d1 # v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate the schema itself
        run: python -m jsonschema --version vector-schema.json 2>/dev/null || true
      - name: Validate every vector file
        run: |
          python - <<'PY'
          import glob, sys
          import jsonschema
          schema = __import__("json").load(open("vector-schema.json"))
          validator = jsonschema.Draft202012Validator(schema)
          failed = False
          for path in sorted(glob.glob("vectors/*.json")):
              import json
              for i, vector in enumerate(json.load(open(path))):
                  for error in validator.iter_errors(vector):
                      print(f"{path}[{i}]: {error.message}")
                      failed = True
          sys.exit(1 if failed else 0)
          PY
